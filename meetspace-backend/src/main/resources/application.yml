spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:meetspace-backend/.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/meetspace?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Brussels}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}

  mail:
    host: ${SMTP_HOST:${MAIL_HOST:}}
    port: ${SMTP_PORT:${MAIL_PORT:587}}
    username: ${SMTP_USERNAME:${MAIL_USERNAME:}}
    password: ${SMTP_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

server:
  port: ${SERVER_PORT:8080}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5174}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${SMTP_FROM:${APP_MAIL_FROM:no-reply@meetspace.local}}
  password-reset:
    log-reset-link-when-email-disabled: ${APP_PASSWORD_RESET_LOG_LINK:false}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:3600000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4174,http://localhost:3000}
  testing:
    allowFakePayments: ${APP_TESTING_ALLOWFAKEPAYMENTS:false}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  public-key: ${STRIPE_PUBLIC_KEY:}

---

spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}

---

spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}

app:
  testing:
    allowFakePayments: false
  password-reset:
    log-reset-link-when-email-disabled: false

---

spring:
  config:
    activate:
      on-profile: dev

app:
  password-reset:
    log-reset-link-when-email-disabled: ${APP_PASSWORD_RESET_LOG_LINK:false}
