spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:meetspace-backend/.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/meetspace?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Brussels}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:${MAIL_HOST:}}
    port: ${SMTP_PORT:${MAIL_PORT:587}}
    username: ${SMTP_USERNAME:${MAIL_USERNAME:}}
    password: ${SMTP_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTIONTIMEOUT:5000}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITETIMEOUT:5000}

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: meetspace-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId:-system}] %logger{36} - %msg%n"

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5174}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${SMTP_FROM:${APP_MAIL_FROM:no-reply@meetspace.local}}
  support:
    admin-email: ${SUPPORT_ADMIN_EMAIL:}
  password-reset:
    log-reset-link-when-email-disabled: ${APP_PASSWORD_RESET_LOG_LINK:false}
  account-deletion:
    log-confirmation-link-when-email-disabled: ${APP_ACCOUNT_DELETION_LOG_LINK:${APP_PASSWORD_RESET_LOG_LINK:false}}
  finance:
    vat-rate: ${APP_FINANCE_VAT_RATE:0.21}
    processing-variable-rate: ${APP_FINANCE_PROCESSING_VARIABLE_RATE:0.015}
    processing-fixed-fee-cents: ${APP_FINANCE_PROCESSING_FIXED_FEE_CENTS:25}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:3600000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4174,http://127.0.0.1:4174,http://localhost:3000,http://127.0.0.1:3000}
  testing:
    allowFakePayments: ${APP_TESTING_ALLOWFAKEPAYMENTS:false}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  public-key: ${STRIPE_PUBLIC_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

---

spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:true}

---

spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}

app:
  testing:
    allowFakePayments: false
  password-reset:
    log-reset-link-when-email-disabled: false
  account-deletion:
    log-confirmation-link-when-email-disabled: false

---

spring:
  config:
    activate:
      on-profile: dev

app:
  mail:
    enabled: false
  password-reset:
    log-reset-link-when-email-disabled: ${APP_PASSWORD_RESET_LOG_LINK:false}
