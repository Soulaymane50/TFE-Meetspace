name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meetspace-backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test

  mysql-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: meetspace
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Load baseline schema
        run: mysql --protocol=tcp -h127.0.0.1 -uroot meetspace < init/Dump_meetspace.sql
      - name: Start backend and validate Flyway + health
        working-directory: meetspace-backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/meetspace?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: ""
          DDL_AUTO: validate
          SPRING_PROFILES_ACTIVE: prod
          JWT_SECRET: meetspace-ci-only-secret-key-32-bytes-minimum
          APP_MAIL_ENABLED: "false"
        run: |
          mvn -B -DskipTests spring-boot:run > ../backend-ci.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          cat ../backend-ci.log
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meetspace-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: meetspace-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build