name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meetspace-backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test

  mysql-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: meetspace
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Start backend on an empty database and validate Flyway + health
        working-directory: meetspace-backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/meetspace?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: ""
          DDL_AUTO: validate
          SPRING_PROFILES_ACTIVE: prod
          JWT_SECRET: meetspace-ci-only-secret-key-32-bytes-minimum
          APP_MAIL_ENABLED: "false"
        run: |
          mvn -B -DskipTests spring-boot:run > ../backend-ci.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          cat ../backend-ci.log
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meetspace-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: meetspace-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  end-to-end:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: meetspace
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: meetspace-frontend/package-lock.json
      - name: Install frontend and Chromium
        working-directory: meetspace-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start the application on a fresh seeded database
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/meetspace?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: ""
          DDL_AUTO: validate
          SPRING_PROFILES_ACTIVE: dev
          JWT_SECRET: meetspace-e2e-only-secret-key-32-bytes-minimum
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:5174
          APP_DEMO_SEED_ENABLED: "true"
          APP_MAIL_ENABLED: "false"
          APP_TESTING_ALLOWFAKEPAYMENTS: "true"
          VITE_API_URL: http://127.0.0.1:8080
        run: |
          cd meetspace-backend
          mvn -B -DskipTests spring-boot:run > ../backend-e2e.log 2>&1 &
          cd ../meetspace-frontend
          npm run dev -- --host 127.0.0.1 --port 5174 > ../frontend-e2e.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"' \
              && curl --fail --silent http://127.0.0.1:5174 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../backend-e2e.log
          cat ../frontend-e2e.log
          exit 1
      - name: Run API, browser and accessibility journeys
        working-directory: meetspace-frontend
        env:
          FRONT_URL: http://127.0.0.1:5174
          API_URL: http://127.0.0.1:8080
          E2E_ADMIN_EMAIL: admin.demo@meetspace-demo.test
          E2E_ADMIN_PASSWORD: MeetSpaceDemo!2026
        run: npm test
